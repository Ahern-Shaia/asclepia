# Local development database (CLAUDE.md §2.1). Not used in production; production is set up by a
# human (R10). Passwords come from .env (never committed): DB_OWNER_PASSWORD, DB_APP_PASSWORD.
services:
  db:
    # Same major version as production (Neon, Postgres 18) and the integration tests
    # (src/test/global-setup.ts). The 18 image keeps its data under /var/lib/postgresql (16 used
    # …/data); a mount at the old path would leave the real data in an anonymous volume.
    image: postgres:18.4-alpine
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: asclepia_owner # owns the schema; used only by `prisma migrate`
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: asclepia
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    volumes:
      - asclepia-db-18:/var/lib/postgresql
      - ./prisma/sql/roles.sql:/sql/roles.sql:ro
      - ./prisma/sql/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "asclepia_owner", "-d", "asclepia"]
      interval: 2s
      retries: 30
volumes:
  # a new name on purpose: the Postgres 16 volume (asclepia-db) is left untouched until the
  # data has been moved over (docs/deploy.md §5 "本機升級")
  asclepia-db-18:
